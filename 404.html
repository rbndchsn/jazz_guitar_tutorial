<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Page not found · Getting Out of ii–V–I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Karla:wght@300..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root {
    --ground:      #E7E5DF;
    --surface:     #F4F3EE;
    --ink:         #1A1714;
    --ink-soft:    #5E574E;
    --ink-faint:   #8C8479;
    --rule:        #C9C5BA;
    --accent:      #7C2F2A;
    --nickel:      #2C5A61;
    --dot-ink:     #F4F3EE;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:      #131210;
      --surface:     #1D1B18;
      --ink:         #EDEAE3;
      --ink-soft:    #A79E92;
      --ink-faint:   #7A7267;
      --rule:        #35312B;
      --accent:      #DD8078;
      --nickel:      #79B7BD;
      --dot-ink:     #131210;
    }
  }

  :root[data-theme="dark"] {
    --ground:      #131210;
    --surface:     #1D1B18;
    --ink:         #EDEAE3;
    --ink-soft:    #A79E92;
    --ink-faint:   #7A7267;
    --rule:        #35312B;
    --accent:      #DD8078;
    --nickel:      #79B7BD;
    --dot-ink:     #131210;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Karla", ui-sans-serif, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    margin: 0;
    padding: 0 20px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 560px; display: flex; flex-direction: column; gap: 22px; padding: 48px 0; }

  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px; font-weight: 500; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--nickel); margin: 0;
  }

  h1 {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-variation-settings: "opsz" 140;
    font-weight: 600; font-size: clamp(2.2rem, 7vw, 3.4rem);
    line-height: 1.0; letter-spacing: -0.025em; text-wrap: balance;
    margin: 0;
  }

  h1 em { font-style: normal; color: var(--accent); }

  p { margin: 0; color: var(--ink-soft); }

  a { color: var(--nickel); text-underline-offset: 3px; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">404 · page not found</p>
  <h1>That one isn't <em>in the changes</em>.</h1>
  <p><a href="index.html">Back to the index</a></p>
</div>

</body>
</html>
